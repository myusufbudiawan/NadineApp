name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
        working-directory: .
      - name: Build with EAS
        run: eas build --platform android --profile preview --non-interactive --wait --json > build.json
      - name: Extract artifact URL
        id: eas
        run: echo "url=$(node -p "JSON.parse(require('fs').readFileSync('build.json'))[0].artifacts.buildUrl")" >> "$GITHUB_OUTPUT"
      - name: Download APK
        run: curl -L "${{ steps.eas.outputs.url }}" -o app.apk
      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          files: apps/mobile/app.apk
